[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tep-agent-lab"
version = "0.1.0"
description = "TEP-specific investigation and archival research contracts"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
