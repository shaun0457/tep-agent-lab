name: CI

on:
  pull_request:
  push:
    branches: [main, integration/batch-1]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out lab
        uses: actions/checkout@v4
        with:
          path: tep-agent-lab

      - name: Check out exact runtime dependency
        uses: actions/checkout@v4
        with:
          repository: shaun0457/industrial-agent-runtime
          ref: 6c8a8d222a7dbf2bd6ed4b9162e3c6b7424d8ec7
          path: industrial-agent-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            tep-agent-lab/pyproject.toml
            industrial-agent-runtime/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps ./industrial-agent-runtime
          python -m pip install --no-deps ./tep-agent-lab

      - name: Remove build metadata before pin attestation
        run: rm -rf industrial-agent-runtime/src/*.egg-info

      - name: Verify exact runtime pin and run tests
        run: >-
          python tep-agent-lab/scripts/check.py
          --runtime industrial-agent-runtime
