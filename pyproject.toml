[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tep-agent-lab"
version = "0.1.0"
description = "TEP-specific investigation and archival research contracts"
requires-python = ">=3.11"
dependencies = ["industrial-agent-runtime==0.1.0", "tep-sim==0.2.0", "numpy>=1.20"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
tep_agent_lab = ["fixtures/benchmarks/*.json"]
